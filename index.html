<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Examples</title>
</head>
<body>
    <h1>H1</h1>
    <ul>
        <li>q</li>
        <li id="tag">a</li>
        <li>z</li>
    </ul>
    <div>
        <span class="test">Z</span>
    </div>
    <div>
        <span class="test">X</span>
    </div>
    <div>
        <span class="test">C</span>
    </div>
    <a href="">
        <span class="test">a</span>
        <span class="test">a</span>
    </a>
    <div class="dom">D</div>
    <div class="dom">O</div>
    <div class="dom">M</div>
    <div class="dom">!</div>
    <button id="pause">countdown pause</button>
    <button id="play">countdown play</button>
</body>
<script src="javascript/lightweight_js_lib.js"></script>
<script>
    console.log(toHHMMSS(54321));
    console.log(node('h1'));
    console.log(node('ul'));
    console.log(node('ul li'));
    console.log(node('.test'));
    console.log(node('div .test'));
    console.log(indexInParent(node('#tag')));
    console.log(indexInParent(node('ul')));
    console.log(indexInParent(node('h1')));
    var dom = document.querySelectorAll('.dom');
    // var dom = document.querySelector('h1');

    delElement(dom);
    addClass(node('h1'), 'test_add_class');
    addClass(node('span')[2], 'test_add_class');
    removeClass(node('a .test')[0], 'test');
    removeClass(node('span')[2], 'test');
    setCookie({name: 'test', value: 34});


    const timer = countdownTimer(5, () => {
    console.log("計時器完成！");
    });
    timer.init();
    console.log(timer.end());
    setInterval(() => {
    console.log(timer.end());
    }, 1000)
    setTimeout(() => {
    timer.clear();
    }, 3000);
    setTimeout(() => {
    timer.clear();
    }, 4000);

    let time = 10;
    let timer2;
    timer2 = countdownTimer(time, () => {
        console.log("計時器完成！");
    });
    timer2.init();
    document.querySelector('#pause').addEventListener('click', () => {
        console.log("計時器暫停！");
        time = Math.floor(timer2.pause());
    });
    document.querySelector('#play').addEventListener('click', () => {
        console.log("計時器開始！");
        console.log(time);
        timer2 = countdownTimer(time, () => {
            console.log("計時器完成！play");
        });
        timer2.init();
    });
</script>
</html>
